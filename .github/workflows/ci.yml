name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main finish so a Pages deploy is never cut short
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build src/FSharp.JsonSerializer.sln -c Release

      - name: Test
        run: dotnet run --project src/FSharp.JsonSerializer.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack src/FSharp.JsonSerializer/FSharp.JsonSerializer.fsproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      # Docs are literate F# scripts: --eval runs every snippet, --strict fails on any error
      - name: Build docs
        run: dotnet fsdocs build --eval --strict --clean --properties Configuration=Release

      # --strict ignores unrecognised (*** ... ***) commands and renders them as page text
      - name: Check docs for unrendered directives
        run: |
          if grep -rlE 'include-(it|value|output|fsi)|\(\*\*' output --include='*.html'; then
            echo "::error::Literate directives were rendered as text in the files above"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy-docs:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
